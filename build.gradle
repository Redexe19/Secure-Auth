plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
loom {
    mods { "secureauth" { sourceSet sourceSets.main } }
    runs { server { vmArgs "-DMC_DEBUG_ENABLED=true", "-DMC_DEBUG_VERBOSE_COMMAND_ERRORS=true" } }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation(include("org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"))
    implementation(include("org.yaml:snakeyaml:${project.snakeyaml_version}"))
    implementation(include("org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}"))
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = "UTF-8" }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar { from("LICENSE") { rename { "${it}_${project.name}" } } }