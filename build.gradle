plugins {
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
        id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
        archivesName = project.archives_base_name
}

repositories {
        // Central for the pure-Java libraries we bundle (Bouncy Castle, SnakeYAML, SQLite).
        // Loom adds the essential Minecraft/Fabric repositories automatically.
        mavenCentral()
}

loom {
        mods {
                "secureauth" {
                        sourceSet sourceSets.main
                }
        }

        runs {
                server {
                        vmArgs "-DMC_DEBUG_ENABLED=true", "-DMC_DEBUG_VERBOSE_COMMAND_ERRORS=true"
                }
        }
}

dependencies {
        // Minecraft 26.x is unobfuscated: no mappings block, official Mojang names.
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"

        // Fabric API
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

        // --- Bundled (jar-in-jar) pure-Java libraries -------------------------
        // Argon2id password hashing (pure Java implementation)
        implementation(include("org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"))
        // YAML configuration parsing
        implementation(include("org.yaml:snakeyaml:${project.snakeyaml_version}"))
        // SQLite JDBC driver for the transactional account database
        implementation(include("org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}"))

        // --- Tests -------------------------------------------------------------
        testImplementation platform("org.junit:junit-bom:${project.junit_version}")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
        def version = project.version
        inputs.property "version", version

        filesMatching("fabric.mod.json") {
                expand "version": version
        }
}

tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.encoding = "UTF-8"
}

java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
}

jar {
        def projectName = project.name
        inputs.property "projectName", projectName

        from("LICENSE") {
                rename { "${it}_$projectName" }
        }
}

test {
        useJUnitPlatform()
        testLogging {
                events "failed", "skipped"
        }
}

publishing {
        publications {
                create("mavenJava", MavenPublication) {
                        from components.java
                }
        }
}
